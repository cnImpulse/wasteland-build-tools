name: Tool portability
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Download fixed candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download ffmpeg-8.1-r1 --dir dist
      - name: Verify hashes, native dependencies and audio rules
        run: node scripts/smoke.mjs dist
